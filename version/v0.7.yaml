# ============================================================
# 规则 (rules)
# 优先级: 从上到下依次匹配
# 广告拦截 > 应用分流 > GEOIP-CN > GeoSite-CN > MATCH
# ============================================================
rules:
  # 广告拦截（最高优先级）
  - GEOSITE,category-ads-all,广告拦截

  # 微软服务（先于 GeoSite-CN，防止 officecdn 等 CN 域名被误判直连）
  - GEOSITE,microsoft@cn,微软中国
  - RULE-SET,Copilot,微软Copilot
  - RULE-SET,MicrosoftCDN,微软中国
  - RULE-SET,Microsoft,微软中国
  - RULE-SET,OneDrive,OneDrive云

  # 谷歌服务（在 GEOIP-CN 之前，确保谷歌服务走代理）
  - RULE-SET,Google,谷歌服务
  - RULE-SET,GoogleCN,谷歌服务

  # 中国 GEOIP（IP 地理库匹配 CN）
  - GEOIP,CN,GeoIP-CN

  # 中国 GeoSite（域名规则库匹配 CN）
  - GEOSITE,CN,GeoSite-CN

  # 其他应用服务
  - RULE-SET,Spotify,Spotify音乐
  - RULE-SET,Telegram,Telegram电报

  # 兜底规则
  - MATCH,Final

# ============================================================
# DNS 防污染
# 国内域名走国内 DNS，国外域名走加密 DNS
# ============================================================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    # NTP 服务
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
  # 国内 DNS（用于解析国内域名）
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://doh.pub/dns-query
  # 国外 DNS（用于被墙域名 fallback）
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - tls://8.8.4.4:853
  # fallback 过滤：只有非 CN 且命中 gfw 列表的域名才走 fallback
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

# ============================================================
# 域名嗅探（默认关闭，按需启用）
# 启用后可根据 TLS/HTTP 流量中的 SNI 进行更精准分流
# 注意：部分应用可能不兼容，如有问题请关闭
# ============================================================
# sniffer:
#   enable: true
#   sniffing:
#     - tls
#     - http
#   force-domain:
#     - +.net
#     - +.com
#   port-whitelist:
#     - 80
#     - 443

# ============================================================
# 全局设置
# ============================================================

# GeoIP 数据模式
geodata-mode: true
geox-url:
  geoip: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
geo-auto-update: true
geo-update-interval: 24

# Geo 文件加载模式
# standard: 全部载入内存，性能最优（推荐，适用于内存 >= 2GB 的设备）
# memconservative: 按需从磁盘读取，省内存但延迟较高
geodata-loader: standard

# 局域网连接
allow-lan: false

# 日志级别: debug | info | warning | error | silent
log-level: info

# IPv6（默认关闭）
# ipv6: true

# TCP Keep-Alive
disable-keep-alive: true

# 统一延迟显示
unified-delay: true
